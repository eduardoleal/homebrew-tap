name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-bot:
    runs-on: macos-26
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check tap syntax
        run: brew test-bot --only-tap-syntax

      - name: Configure private upstream access
        if: github.actor != 'dependabot[bot]'
        env:
          ZELLIJ_TAB_NAMER_DEPLOY_KEY: ${{ secrets.ZELLIJ_TAB_NAMER_DEPLOY_KEY }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$ZELLIJ_TAB_NAMER_DEPLOY_KEY" > "$HOME/.ssh/zellij-tab-namer"
          chmod 0600 "$HOME/.ssh/zellij-tab-namer"
          ssh-keyscan -H github.com > "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          ssh-add "$HOME/.ssh/zellij-tab-namer"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          ssh -T git@github.com 2>&1 | grep 'successfully authenticated'

      - name: Build and test formula
        if: github.actor != 'dependabot[bot]'
        run: |
          brew install --build-from-source eduardoleal/tap/zellij-tab-namer
          brew test eduardoleal/tap/zellij-tab-namer
