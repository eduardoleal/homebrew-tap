name: brew test-bot
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('brew test-bot dispatch {0}', inputs.head_sha)
      || format('brew test-bot {0}', github.ref_name) }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact automation commit to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-bot:
    runs-on: macos-26
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate dispatched head
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid head SHA: $EXPECTED_SHA" >&2
            exit 1
          fi

      - name: Check out dispatched head
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}

      - name: Verify dispatched head
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Test release updater
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v

      - name: Check tap syntax
        run: brew test-bot --only-tap-syntax

      - name: Build and test formula
        run: |
          brew install --build-from-source eduardoleal/tap/zellij-tab-namer
          brew test eduardoleal/tap/zellij-tab-namer
