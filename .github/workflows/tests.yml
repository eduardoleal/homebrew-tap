name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-bot:
    runs-on: macos-26
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check tap syntax
        run: brew test-bot --only-tap-syntax

      - name: Check private upstream access
        if: github.actor != 'dependabot[bot]'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.ZELLIJ_TAB_NAMER_RELEASE_TOKEN }}
        run: |
          test -n "$HOMEBREW_GITHUB_API_TOKEN"
          echo "HOMEBREW_GITHUB_API_TOKEN=$HOMEBREW_GITHUB_API_TOKEN" >> "$GITHUB_ENV"

      - name: Build and test formula
        if: github.actor != 'dependabot[bot]'
        run: |
          brew install --build-from-source eduardoleal/tap/zellij-tab-namer
          brew test eduardoleal/tap/zellij-tab-namer
