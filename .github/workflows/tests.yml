name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-bot:
    runs-on: macos-26
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check tap syntax
        run: brew test-bot --only-tap-syntax

      - name: Configure private upstream access
        if: github.actor != 'dependabot[bot]'
        env:
          ZELLIJ_TAB_NAMER_DEPLOY_KEY: ${{ secrets.ZELLIJ_TAB_NAMER_DEPLOY_KEY }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$ZELLIJ_TAB_NAMER_DEPLOY_KEY" > "$HOME/.ssh/zellij-tab-namer"
          chmod 0600 "$HOME/.ssh/zellij-tab-namer"
          ssh-keyscan -H github.com > "$HOME/.ssh/known_hosts"
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/zellij-tab-namer -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Build and test formula
        if: github.actor != 'dependabot[bot]'
        run: |
          brew install --build-from-source eduardoleal/tap/zellij-tab-namer
          brew test eduardoleal/tap/zellij-tab-namer
